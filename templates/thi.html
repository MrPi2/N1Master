<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thi thử N1 - Web Learning Japan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter',sans-serif}
  .opt-card{cursor:pointer;transition:all .2s}
  .opt-card.sel{border-color:#f59e0b;background:#f59e0b/10}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div id="app"></div>
<script>
const API='http://datnv.pythonanywhere.com';
const QUIZ_TITLE='日本語能力試験 模擬テスト';
const TIME_LIMIT=300;
let EXAMS=[], questions=[], currentExamId='', currentExamTitle='';
let state={answers:{},flagged:{},current:0,timeLeft:TIME_LIMIT,finished:false,scoreData:null};
let timerInt=null;
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function letter(i){return 'ABCD'[i]||String.fromCharCode(65+i);}

function loadExams(){
  fetch(API+'/api/exams').then(r=>r.json()).then(list=>{
    EXAMS=list&&list.length?list:[];
    if(EXAMS.length) renderPicker(); else fallbackMsg();
  }).catch(()=>fallbackMsg());
}
function fallbackMsg(){
  app.innerHTML='<main class="max-w-2xl mx-auto p-10 text-center text-slate-300">Không thể tải đề thi. Hãy đảm bảo backend đang chạy.</main>';
}
function renderPicker(){
  app.innerHTML=`
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
    <h1 class="text-2xl font-extrabold text-center mb-2">${QUIZ_TITLE}</h1>
    <p class="text-center text-slate-400 text-sm mb-8">Chọn đề thi để bắt đầu</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      ${EXAMS.map(e=>`
        <button onclick="startExam('${e.id}')" class="text-left rounded-2xl bg-slate-800/50 border border-slate-700 p-5 hover:border-amber-400 transition-all duration-300">
          <p class="font-bold text-slate-100">${e.title}</p>
          <p class="text-xs text-slate-400 mt-1">${e.subject} · ${e.questions.length} câu</p>
        </button>`).join('')}
    </div>
  </main>`;
  lucide.createIcons();
}
function startExam(id){
  const ex=EXAMS.find(x=>x.id===id); if(!ex)return;
  currentExamId=ex.id; currentExamTitle=ex.title;
  questions=ex.questions.map(q=>({id:String(q.id),question:q.question,options:q.options,correct:q.correct,explanation:q.explanation}));
  state={answers:{},flagged:{},current:0,timeLeft:TIME_LIMIT,finished:false,scoreData:null};
  startTimer(); renderQuiz();
}
function startTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    if(state.finished)return;
    state.timeLeft--;
    const m=Math.floor(state.timeLeft/60),s=state.timeLeft%60;
    const el=$('#timer'); if(el)el.textContent=`${m}:${s<10?'0':''}${s}`;
    if(state.timeLeft<=0) requestSubmit(true);
  },1000);
}
function fmtTime(){const m=Math.floor(state.timeLeft/60),s=state.timeLeft%60;return `${m}:${s<10?'0':''}${s}`;}
function renderQuiz(){
  const i=state.current, q=questions[i];
  const pct=Math.round((i+1)/questions.length*100);
  app.innerHTML=`
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6">
    <div class="flex items-center justify-between mb-4">
      <button onclick="goHome()" class="text-slate-400 hover:text-amber-400 text-sm">← Chọn đề</button>
      <div class="text-right">
        <div class="text-xs text-slate-400">Thời gian</div>
        <div id="timer" class="text-lg font-bold text-amber-400">${fmtTime()}</div>
      </div>
    </div>
    <div class="h-2 bg-slate-700 rounded-full mb-4"><div class="h-2 bg-amber-400 rounded-full transition-all duration-300" style="width:${pct}%"></div></div>
    <div class="flex items-center justify-between text-sm text-slate-400 mb-2">
      <span>Tiến độ: <b class="text-slate-100">${i+1}/${questions.length}</b></span>
      <button onclick="toggleFlag(${i})" class="flex items-center gap-1 ${state.flagged[i]?'text-amber-400':'text-slate-500'}">
        <i data-lucide="flag" class="w-4 h-4"></i> ${state.flagged[i]?'Đã đánh dấu':'Đánh dấu'}
      </button>
    </div>
    <article class="rounded-2xl bg-slate-800/50 border border-slate-700 p-5 mb-4 shadow-sm">
      <div class="flex items-start gap-3 mb-4">
        <span class="w-7 h-7 shrink-0 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-sm">${i+1}</span>
        <p class="font-semibold text-slate-100 text-lg">${q.question}</p>
      </div>
      <div id="optionsBox" class="space-y-2">
        ${q.options.map((opt,oi)=>`
          <div class="opt-card flex items-center gap-3 p-3 rounded-xl border ${state.answers[q.id]===oi?'sel':'border-slate-700 bg-slate-900/40'}" onclick="choose(${i},${oi})">
            <span class="w-7 h-7 shrink-0 rounded-lg ${state.answers[q.id]===oi?'bg-amber-500 text-white':'bg-slate-700 text-slate-300'} flex items-center justify-center font-bold text-xs">${letter(oi)}</span>
            <span class="text-sm">${opt}</span>
          </div>`).join('')}
      </div>
    </article>
    <div class="flex items-center justify-between">
      <button onclick="prevQ()" ${i===0?'disabled':''} class="px-4 py-2 rounded-xl bg-slate-700 text-slate-200 disabled:opacity-40">← Trước</button>
      ${i===questions.length-1?'<button onclick="requestSubmit(false)" class="px-5 py-2 rounded-xl bg-amber-500 text-white font-bold">Nộp bài</button>':'<button onclick="nextQ()" class="px-4 py-2 rounded-xl bg-slate-700 text-slate-200">Tiếp →</button>'}
    </div>
    <div class="grid grid-cols-10 gap-1.5 mt-6" id="navGrid"></div>
  </div>`;
  renderNav();
  lucide.createIcons();
}
function renderNav(){
  const g=$('#navGrid'); if(!g)return;
  g.innerHTML=questions.map((_,idx)=>{
    let cls='border-slate-700 bg-slate-800';
    if(state.answers[questions[idx].id]!==undefined)cls='border-emerald-500 bg-emerald-500/20 text-emerald-300';
    if(state.flagged[idx])cls='border-amber-500 bg-amber-500/20 text-amber-300';
    if(idx===state.current)cls='border-amber-400 bg-amber-400 text-slate-900 font-bold';
    return `<button onclick="goto(${idx})" class="aspect-square rounded-lg border text-xs ${cls}">${idx+1}</button>`;
  }).join('');
}
function choose(i,oi){state.answers[questions[i].id]=oi;renderQuiz();}
function toggleFlag(i){state.flagged[i]=!state.flagged[i];renderQuiz();}
function prevQ(){if(state.current>0){state.current--;renderQuiz();}}
function nextQ(){if(state.current<questions.length-1){state.current++;renderQuiz();}}
function goto(i){state.current=i;renderQuiz();}
function goHome(){clearInterval(timerInt);loadExams();}
function requestSubmit(auto){
  clearInterval(timerInt);
  const unanswered=questions.filter(q=>state.answers[q.id]===undefined).length;
  if(auto||unanswered===0||confirm(`Bạn còn ${unanswered} câu chưa làm. Xác nhận nộp bài?`)){
    state.finished=true; state.scoreData=calculateScore(); submitToServer(state.scoreData); showResults();
  } else { startTimer(); }
}
function calculateScore(){
  let correct=0;
  questions.forEach(q=>{if(state.answers[q.id]===q.correct)correct++;});
  const pct=Math.round(correct/questions.length*100);
  return {correct,total:questions.length,pct};
}
function submitToServer(score){
  try{
    let user=localStorage.getItem('quiz_user')||'';
    if(!user){user=prompt('Nhập tên của bạn để lưu kết quả:')||'anonymous';localStorage.setItem('quiz_user',user);}
    const answers=questions.map(q=>{const c=state.answers[q.id];return{qid:String(q.id),chosen:(c===undefined?null:c),correct:q.correct};});
    const payload={user,exam:currentExamId,examTitle:currentExamTitle,score:score.pct,correct:score.correct,total:score.total,passingScore:80,timeSec:(TIME_LIMIT-state.timeLeft),answers};
    fetch(API+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(r=>r.json()).then(d=>console.log('saved',d.id)).catch(e=>console.warn('submit failed',e));
  }catch(e){console.warn(e);}
}
function showResults(){
  const s=state.scoreData;
  const passed=s.pct>=80;
  app.innerHTML=`
  <main class="max-w-2xl mx-auto px-4 py-10 text-center">
    <div class="rounded-3xl bg-slate-800/50 border border-slate-700 p-8 shadow-lg">
      <p class="text-slate-400 text-sm">Kết quả đề: ${currentExamTitle}</p>
      <div class="text-6xl font-extrabold my-4 ${passed?'text-emerald-400':'text-rose-400'}">${s.pct}%</div>
      <p class="text-lg">Đúng <b>${s.correct}</b> / ${s.total} câu · <b>${passed?'ĐẠT':'TRƯỢT'}</b></p>
      <div class="flex gap-3 justify-center mt-6">
        <button onclick="goHome()" class="px-5 py-2 rounded-xl bg-slate-700 text-slate-200">Làm đề khác</button>
        <button onclick="showReview()" class="px-5 py-2 rounded-xl bg-amber-500 text-white font-bold">Xem chi tiết</button>
      </div>
    </div>
    <div id="reviewBox" class="text-left mt-6"></div>
  </main>`;
  lucide.createIcons();
}
function showReview(){
  const box=$('#reviewBox');
  box.innerHTML=`<h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i data-lucide="list-checks" class="w-5 h-5 text-amber-400"></i> Xem lại chi tiết</h3>`+
  questions.map((q,i)=>{
    const chosen=state.answers[q.id]; const isC=chosen===q.correct;
    const opts=q.options.map((opt,oi)=>{
      let cls='border-slate-700 bg-slate-900/40';
      if(oi===q.correct)cls='border-emerald-500 bg-emerald-500/10 text-emerald-300';
      else if(oi===chosen&&!isC)cls='border-rose-500 bg-rose-500/10 text-rose-300';
      return `<div class="flex items-center gap-3 p-3 rounded-xl border ${cls}"><span class="w-7 h-7 rounded-lg ${oi===q.correct?'bg-emerald-500 text-white':(oi===chosen&&!isC?'bg-rose-500 text-white':'bg-slate-700 text-slate-300')} flex items-center justify-center font-bold text-xs">${letter(oi)}</span><span class="text-sm">${opt}</span></div>`;
    }).join('');
    return `<article class="rounded-2xl bg-slate-800/50 border border-slate-700 p-5 mb-4"><div class="flex items-start gap-3 mb-3"><span class="w-7 h-7 rounded-lg ${isC?'bg-emerald-500/20 text-emerald-400':'bg-rose-500/20 text-rose-400'} flex items-center justify-center font-bold text-sm">${i+1}</span><p class="font-semibold text-slate-100">${q.question}</p></div><div class="space-y-2 mb-3">${opts}</div><div class="text-xs text-slate-400 bg-slate-900/50 rounded-lg p-3"><b class="text-amber-400">Giải thích:</b> ${q.explanation}</div></article>`;
  }).join('');
  lucide.createIcons();
  box.scrollIntoView({behavior:'smooth'});
}
loadExams();
</script>
</body>
</html>
